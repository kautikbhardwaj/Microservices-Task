apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: users-ingress
  labels:
    app: microservices-task
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /users
spec:
  ingressClassName: nginx
  rules:
    - host: microservices.local
      http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 3000
---
